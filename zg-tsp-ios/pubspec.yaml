# zg-tsp-ios —— iOS 移动端（Flutter，四角色）
# 本模块依赖自封闭，可独立安装/构建/发布
name: zg_tsp_ios
description: zg-tsp iOS 移动端（学生 / 家长 / 老师 / admin）
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 网络
  http: ^1.6.0
  # 本地存储（token 等）
  shared_preferences: ^2.5.6
  # 状态管理
  provider: ^6.1.5+1
  # 图片上传
  image_picker: ^1.1.2
  # 文件选择（作业上传）
  # 与 Android 端保持同一版本下限：10.x 起插件自身 compileSdk 升至 36，
  # 8.x 仍为 android-34，会在 Android 端触发 AAR metadata 校验失败。
  file_picker: ^10.3.10
  # 打开服务端生成的 PDF（导出文章，迭代 v2.1）
  url_launcher: ^6.3.1
  # 图表（积分概览）
  fl_chart: ^0.69.0
  # 日期
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

# --- 渠道配置（决策 7：测试 + 生产）---
# 渠道（flavor）不在 pubspec 中声明：Flavor 不是 pubspec 的合法键，Flutter 不读取它。
# 实际机制由 scripts/build.sh 在打包时动态改写平台工程：
#   - Android：scripts/lib/android_flavor.py 注入 android/app/build.gradle.kts 的
#     productFlavors{dev,prod} 与 buildFeatures.resValues
#   - iOS：scripts/lib/ios_flavor.py 注入 pbxproj 的 *-Dev BuildConfiguration
#     与 Dev.xcscheme
# 运行时渠道由 --dart-define=FLAVOR=dev|prod 传入，见 lib/core/config.dart。