# zg-tsp-android —— Android 移动端（Flutter，四角色）
# 本模块依赖自封闭，可独立安装/构建/发布
name: zg_tsp_android
description: zg-tsp Android 移动端（学生 / 家长 / 老师 / admin）
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 网络
  http: ^1.2.2
  # 本地存储（token 等）
  shared_preferences: ^2.3.3
  # 状态管理
  provider: ^6.1.2
  # 图片上传
  image_picker: ^1.1.2
  # 文件选择（作业上传）
  file_picker: ^8.1.4
  # 图表（积分概览）
  fl_chart: ^0.69.0
  # 日期
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

# --- 渠道配置（决策 7：测试 + 生产）---
flavors:
  - name: dev
    description: 测试环境
  - name: prod
    description: 生产环境